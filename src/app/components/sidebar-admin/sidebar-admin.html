<!-- ปุ่มเมนู (แสดงเฉพาะมือถือ) -->
<button class="mobile-menu-btn" *ngIf="isMobile" (click)="toggle()" aria-label="เปิดเมนู">
  <span class="icon">menu</span>
</button>
<div class="mobile-backdrop" [class.show]="isMobile && isOpen" (click)="closeMobile()"></div>

<aside class="sidebar" [class.collapsed]="isCollapsed" [class.open]="isOpen">

  <span class="deco d1"></span>
  <span class="deco d2"></span>

  <div class="sidebar-header">
    <img *ngIf="!isCollapsed" src="assets/logo-horizontal.png" alt="โลโก้สุทธาเวช" class="logo-wide">
    <img *ngIf="isCollapsed" src="assets/logo.png" alt="โลโก้สุทธาเวช" class="logo-img">
    <button class="toggle-btn" (click)="toggle()">
      <span class="icon" *ngIf="isMobile">close</span>
      <span class="icon" *ngIf="!isMobile">{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</span>
    </button>
  </div>

  <nav class="sidebar-menu">
    <p class="menu-label" *ngIf="!isCollapsed">เมนูหลัก</p>

    <a routerLink="/home-admin" routerLinkActive="active" class="menu-item" (click)="closeMobile()" [title]="isCollapsed ? 'หน้าแรก' : ''">
      <span class="icon">home</span>
      <span class="menu-text" *ngIf="!isCollapsed">หน้าแรก</span>
    </a>
    <a routerLink="/manage-accounts" routerLinkActive="active" class="menu-item" (click)="closeMobile()" [title]="isCollapsed ? 'จัดการเจ้าหน้าที่' : ''">
      <span class="icon">people</span>
      <span class="menu-text" *ngIf="!isCollapsed">จัดการเจ้าหน้าที่</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="menu-item" (click)="closeMobile()" [title]="isCollapsed ? 'ตั้งค่าหน่วยงาน' : ''">
      <span class="icon">apartment</span>
      <span class="menu-text" *ngIf="!isCollapsed">ตั้งค่าหน่วยงาน</span>
    </a>

    <p class="menu-label" *ngIf="!isCollapsed">บัญชี</p>
    <div class="menu-divider" *ngIf="isCollapsed"></div>

    <a routerLink="/profile-admin" routerLinkActive="active" class="menu-item" (click)="closeMobile()" [title]="isCollapsed ? 'ข้อมูลส่วนตัว' : ''">
      <span class="icon">person</span>
      <span class="menu-text" *ngIf="!isCollapsed">ข้อมูลส่วนตัว</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="role-chip" *ngIf="!isCollapsed">
      <span class="icon">admin_panel_settings</span> ผู้ดูแลระบบ
    </div>
    <button class="logout-btn" (click)="logout()" [title]="isCollapsed ? 'ออกจากระบบ' : ''">
      <span class="icon">logout</span>
      <span class="menu-text" *ngIf="!isCollapsed">ออกจากระบบ</span>
    </button>
  </div>
</aside>
